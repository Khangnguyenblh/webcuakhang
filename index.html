<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test độ gay 🌈</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 30px 24px;
            text-align: center;
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            box-shadow: 0 10px 40px #0003;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .emoji {
            font-size: 65px;
            margin: 20px 0;
        }

        .percent {
            font-size: 42px;
            font-weight: bold;
            margin: 15px;
        }

        .progress-bg {
            width: 100%;
            height: 25px;
            background: #ffffff40;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ffffff70;
        }

        .progress {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #ff4d6d,
                #ffbe0b,
                #06d6a0,
                #8338ec
            );
            transition: width 0.08s linear;
        }

        #status {
            min-height: 48px;
            margin: 20px 0;
            font-size: 17px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #6a11cb;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.04);
            background: #ffe0f0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .note {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌈 TEST ĐỘ GAY 🌈</h1>

        <div class="emoji" id="emoji">😎</div>

        <div class="progress-bg">
            <div class="progress" id="bar"></div>
        </div>

        <div class="percent" id="percent">0%</div>

        <p id="status">Bạn đã sẵn sàng chưa? 👀</p>

        <button id="startBtn" onclick="startTest()">
            🚀 BẮT ĐẦU ĐO
        </button>

        <div class="note">
            ⚠️ Chỉ là trò đùa giải trí, không đánh giá xu hướng tính dục.
        </div>
    </div>

    <script>
        let running = false;

        function startTest() {
            if (running) return;
            running = true;

            const bar = document.getElementById("bar");
            const percent = document.getElementById("percent");
            const status = document.getElementById("status");
            const emoji = document.getElementById("emoji");
            const btn = document.getElementById("startBtn");

            btn.disabled = true;
            btn.textContent = "⏳ ĐANG PHÂN TÍCH...";
            bar.style.width = "0%";
            percent.textContent = "0%";
            emoji.textContent = "🔍";

            let value = 0;

            const messages = [
                "Đang quét dữ liệu... 🧐",
                "Phát hiện năng lượng bí ẩn... 👀",
                "Hệ thống đang phân tích... 🤖",
                "Sắp có kết quả rồi... 😱"
            ];

            const timer = setInterval(() => {
                value += Math.floor(Math.random() * 4) + 1;

                if (value >= 100) {
                    value = 100;
                    clearInterval(timer);

                    // Kết quả ngẫu nhiên chỉ để giải trí
                    const result = Math.floor(Math.random() * 101);

                    percent.textContent = result + "%";
                    bar.style.width = result + "%";
                    emoji.textContent =
                        result >= 80 ? "🌈" :
                        result >= 50 ? "😏" :
                        result >= 25 ? "😎" : "🗿";

                    status.textContent =
                        result >= 80 ? "🌈 Hệ thống nổ tung vì quá nhiều màu sắc!" :
                        result >= 50 ? "🔥 Kết quả khá là đáng nghi nha!" :
                        result >= 25 ? "👀 Máy quét vẫn còn đang hoang mang!" :
                        "🗿 Máy quét xin phép im lặng!";

                    btn.disabled = false;
                    btn.textContent = "🔄 ĐO LẠI";
                    running = false;
                } else {
                    bar.style.width = value + "%";
                    percent.textContent = value + "%";

                    if (value < 30) {
                        status.textContent = messages[0];
                    } else if (value < 55) {
                        status.textContent = messages[1];
                    } else if (value < 80) {
                        status.textContent = messages[2];
                    } else {
                        status.textContent = messages[3];
                    }
                }
            }, 80);
        }
    </script>
</body>
</html>
